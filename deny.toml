# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# Run by the security-audit workflow on a fresh resolve. No advisory is ignored.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]

# alice-settlement is offered as AGPL-3.0-only OR LicenseRef-Commercial; it is published under the
# AGPL-3.0-only side
[[licenses.exceptions]]
name = "alice-settlement"
allow = ["LicenseRef-Proprietary"]

[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dependencies have no registry version
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# alice-sign is a git dependency pinned to one commit
allow-git = ["https://github.com/ext-sakamoro/ALICE-Sign"]
