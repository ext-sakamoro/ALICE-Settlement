[package]
name = "alice-settlement"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Post-trade settlement, netting, and clearing engine"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "alice_settlement"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = []
ffi = []

[dependencies]
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "6b79a0bad3db4c7de1719251d6a2a9405fbc0ee2" }

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
